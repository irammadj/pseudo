<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <span class="logo">Launchpad</span>
      <div>
        <a href="#features">Features</a>
        <a href="#pricing">Pricing</a>
        <a href="#signup">Sign up</a>
      </div>
    </nav>

    <header>
      <div class="container">
        <h1>Launch faster with Launchpad</h1>
        <p>
          Ship your idea in days, not months.
          <span class="badge" data-tooltip="Free for 14 days">NEW</span>
        </p>
      </div>
    </header>

    <section id="features">
      <div class="container">
        <h2>Features</h2>
        <ul>
          <li>Instant deploys</li>
          <li>Team workspaces</li>
          <li>Usage analytics</li>
        </ul>
      </div>
    </section>

    <section id="pricing">
      <div class="container">
        <h2>Pricing</h2>
        <table>
          <tr>
            <th>Plan</th>
            <th>Seats</th>
            <th>Price</th>
          </tr>
          <tr>
            <td>Starter</td>
            <td>1</td>
            <td>$0</td>
          </tr>
          <tr>
            <td>Team</td>
            <td>10</td>
            <td>$29</td>
          </tr>
          <tr>
            <td>Business</td>
            <td>50</td>
            <td>$99</td>
          </tr>
        </table>
      </div>
    </section>

    <section id="signup">
      <div class="container">
        <h2>Sign up</h2>
        <form>
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Ada Lovelace" />

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="ada@example.com" />

          <button type="submit">Create account</button>
        </form>
      </div>
    </section>
  </body>
</html>
